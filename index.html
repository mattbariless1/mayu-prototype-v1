<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayu | Prototype</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-icon">
                <div class="circle outer"></div>
                <div class="circle mid"></div>
                <div class="circle inner"></div>
            </div>
            <h1>MAYU</h1>
            <p class="tagline">love made audible</p>
        </header>

        <main>
            <section class="controls">
                <button id="recordBtn" class="btn-pill">Record</button>
                <div id="status" class="status-text">Ready</div>
            </section>

            <section class="repository">
                <h3>Recordings</h3>
                <div id="recordingsList">
                    </div>
            </section>

            <section class="playback-controls">
                <div class="ambient-selector" style="margin-bottom: 15px;">
                    <label for="ambientSelect" style="font-size: 0.9rem; opacity: 0.7;">Ambient Track:</label>
                    <select id="ambientSelect" style="padding: 5px; border-radius: 5px; border: 1px solid #ccc;">
                        <option value="1">Track 1</option>
                        <option value="2">Track 2</option>
                    </select>
                </div>

                <div class="button-group" style="display: flex; gap: 10px; justify-content: center;">
                    <button id="playBtn" class="btn-pill secondary">Play Selection</button>
                    <button id="playMixBtn" class="btn-pill secondary">Play Mayu Mix</button>
                    <button id="stopBtn" class="btn-pill secondary">Stop</button>
                </div>
            </section>
        </main>
    </div>

    <script src="https://c74-public.nyc3.digitaloceanspaces.com/rnbo/1.4.1/rnbo.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
