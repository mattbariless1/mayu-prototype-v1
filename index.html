<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayu Prototype V2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <header>
        <h1>Mayu Prototype V2</h1>
        <p>Dynamic Timeline Engine</p>
    </header>

    <section class="panel">
        <h2>1. Record Voice</h2>
        <div class="control-group">
            <button id="recordBtn" class="btn">Record</button>
            <span id="status" class="status-text">Ready</span>
        </div>
    </section>

    <section class="panel">
        <h2>2. Voice Recordings</h2>
        <p class="helper-text">Select a recording to use in the soundscape.</p>
        
        <div id="recordingsList" class="recordings-container">
            Loading recordings...
        </div>
    </section>

    <section class="panel">
        <h2>3. Real-Time Playback</h2>
        
        <div class="control-group">
            <button id="playBtn" class="btn">Audition Voice</button>
            <button id="stopBtn" class="btn stop">Stop Audition / Soundscape</button>
        </div>

        <hr>

        <div class="control-group toggle-container">
            <label for="mixToggle" class="toggle-label">
                <input type="checkbox" id="mixToggle" class="toggle-checkbox">
                <strong>Play Continuous Soundscape</strong>
            </label>
            <p class="helper-text">Starts the dynamic timeline weaving Music, Atmosphere, and Voice.</p>
        </div>
    </section>

    <section class="panel">
        <h2>4. Export 10-Minute File</h2>
        <div class="control-group">
            <button id="exportWavBtn" class="btn primary">Export 10-Min Soundscape</button>
            <span id="exportStatus" class="status-text"></span>
        </div>
    </section>

    <script src="app.js"></script>

</body>
</html>
