<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayu Prototype</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.cycling74.com/rnbo/1.4.1/rnbo.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="container">
        
        <header>
            <div class="logo-icon">
                <div class="circle outer"></div>
                <div class="circle mid"></div>
                <div class="circle inner"></div>
            </div>
            <h1>MAYU</h1>
            <p class="tagline">Dynamic Timeline Engine</p>
        </header>

        <div class="mix-engine-panel">
            <button id="recordBtn" class="btn-pill">Record Voice</button>
            <div id="status" class="status-text">Ready</div>
        </div>

        <div class="repository">
            <div id="recordingsList" class="recordings-container">
                Loading recordings...
            </div>
        </div>

        <div class="mix-engine-panel">
            <p class="status-text" style="margin-top: 0; margin-bottom: 15px;">Real-Time Playback</p>
            
            <div class="utility-panel">
                <button id="playBtn" class="btn-pill" style="margin: 0;">Audition</button>
                
                <label class="switch large" title="Play Continuous Soundscape">
                    <input type="checkbox" id="mixToggle">
                    <span class="slider"></span>
                </label>

                <button id="stopBtn" class="btn-icon-stop" title="Stop Soundscape">■</button>
            </div>
        </div>

        <div class="mix-engine-panel">
            <button id="exportWavBtn" class="btn-pill">Export 10-Min Soundscape</button>
            <div id="exportStatus" class="status-text"></div>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
