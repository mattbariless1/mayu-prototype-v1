<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayu | Prototype</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-icon">
                <div class="circle outer"></div>
                <div class="circle mid"></div>
                <div class="circle inner"></div>
            </div>
            <h1>MAYU</h1>
            <p class="tagline">love made audible</p>
            
            <div class="master-toggle" style="margin-top: 35px; margin-bottom: 10px; display: flex; justify-content: center;">
                <label class="switch large">
                    <input type="checkbox" id="mixToggle">
                    <span class="slider round"></span>
                </label>
            </div>
        </header>

        <main>
            <section class="controls">
                <button id="recordBtn" class="btn-pill">Record</button>
                <div id="status" class="status-text"></div> </section>

            <section class="repository">
                <h3 style="text-align: center;">Recordings</h3>
                <div id="recordingsList">
                    </div>
                
                <div class="utility-panel" style="display: flex; gap: 15px; justify-content: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05);">
                    <button id="playBtn" class="btn-pill secondary">Audition</button>
                    <button id="stopBtn" class="btn-icon-stop">■</button>
                </div>
            </section>

            <section class="playback-controls">
                <div class="mix-engine-panel" style="background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 15px; margin-top: 20px;">
                    <h4 style="text-align: center; margin-bottom: 15px; font-weight: normal; opacity: 0.8; letter-spacing: 1px;">Ambient Track</h4>
                    <div class="ambient-selector" style="display: flex; justify-content: center;">
                        <select id="ambientSelect" style="padding: 8px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: inherit; cursor: pointer;">
                            <option value="1" style="color: black;">Track 1</option>
                            <option value="2" style="color: black;">Track 2</option>
                        </select>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://c74-public.nyc3.digitaloceanspaces.com/rnbo/1.4.1/rnbo.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
